<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who's Watching?</title>

    <link rel="stylesheet" href="whoswatching.css">
</head>
<body>

<div class="container">

    <h1>Who's Watching?</h1>

    <div class="profiles">

        <!-- User -->
        <div class="profile" id="userProfile">
            <img src="images/images/profile1.png" alt="User">
            <p id="username">Aditya</p>
        </div>

        <!-- Guest -->
        <div class="profile" id="guestProfile">
            <img src="images/images/profile2.png" alt="Guest">
            <p>GUEST</p>
        </div>

    </div>

    <div id="editName">
        <input type="text" id="profileInput" placeholder="Enter Name">
        <button id="saveBtn">Save</button>
    </div>

</div>

<script src="whoswatching.js"></script>

</body>
</html>
